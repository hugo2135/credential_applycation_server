name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, linux-arm64]
    steps:
      - name: 取得最新程式碼
        uses: actions/checkout@v4

      - name: 建立 .env
        run: |
          cat > .env << EOF
          SERVER_JWT_SECRET=${{ secrets.SERVER_JWT_SECRET }}
          ADMIN_SECRET=${{ secrets.ADMIN_SECRET }}
          DATABASE_URL=sqlite:////app/data/credential.db
          EOF

      - name: 建立資料目錄（SQLite 持久化）
        run: mkdir -p ${{ github.workspace }}/data

      - name: 更新 docker-compose 資料目錄路徑
        run: |
          sed -i 's|./data:/app/data|${{ github.workspace }}/data:/app/data|g' docker-compose.yml

      - name: 建置並啟動服務
        run: |
          docker compose up --build -d
          docker image prune -f
