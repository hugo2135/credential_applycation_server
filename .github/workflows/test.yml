name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 不需要真的 Azure/Power BI 憑證：conftest.py 用 os.environ.setdefault() 給假的
      # SERVER_JWT_SECRET/ADMIN_SECRET，DATABASE_URL 指向 tempfile，測試完全自給自足。
      - run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - run: npm ci --prefix admin-frontend
      # build script 內部是 `run-p type-check "build-only"`，type-check 沒過一樣會讓這步失敗。
      - run: npm run build --prefix admin-frontend
