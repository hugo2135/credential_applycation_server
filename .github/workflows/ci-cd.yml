name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements-dev.txt

      # 不需要真的 Azure/Power BI 憑證：conftest.py 用 os.environ.setdefault() 給假的
      # SERVER_JWT_SECRET/ADMIN_SECRET，DATABASE_URL 指向 tempfile，測試完全自給自足。
      #
      # 用 `python -m pytest`，不要裸的 `pytest`：repo 沒有 pyproject.toml 的 pytest
      # pythonpath 設定、也沒有 tests/__init__.py，conftest.py 的 `from app.main import app`
      # 要靠 `-m` 把當前目錄加進 sys.path 才能 import 到根目錄的 app 套件；裸 `pytest`
      # 不會加，會直接 ModuleNotFoundError: No module named 'app'。
      - run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-frontend/package-lock.json

      - run: npm ci --prefix admin-frontend
      # build script 內部是 `run-p type-check "build-only"`，type-check 沒過一樣會讓這步失敗。
      - run: npm run build --prefix admin-frontend

  deploy:
    needs: [backend, frontend]
    # `success()` 是必要的，不是裝飾：一旦寫了自訂的 if 條件，GitHub 就不會再自動套用
    # 「needs 的 job 都成功才跑」這個預設行為，兩個條件要自己都寫出來，不然測試沒過
    # 這個 job 一樣會執行，等於白做了 needs 這一步的意義。
    #
    # push: 沒有限定分支（讓 backend/frontend 在所有分支跟 PR 都會跑），所以部署本身
    # 要在這裡額外限制只在 push 到 main 時才真的執行，其他分支/PR 一律跳過（skipped，
    # 不算失敗，不會擋任何東西）。
    if: success() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    # VM 是共用資源，同一時間只能有一個 deploy 對它動手。連續兩次 push（例如在 GitHub
    # 網頁上連續改兩個檔案）會觸發兩個 run，兩邊的 docker compose up 撞在一起時，其中
    # 一個會對另一個剛砍掉的容器動作，得到 "No such container: <id>" 而失敗——實際上
    # 部署是成功的（有一邊跑完了），只是誤報成紅叉。
    #
    # 不用 cancel-in-progress：正在跑的 docker compose 被中途砍掉，容器可能停在半殘
    # 狀態，比排隊更糟。排隊的那次頂多是 git pull 顯示 Already up to date、build 全走
    # 快取，很快就結束。
    concurrency:
      group: deploy-vm
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 刻意不用第三方 GitHub Action（例如 appleboy/ssh-action）碰這把私鑰——
      # 這是碰得到正式環境的憑證，直接用 GitHub runner 內建的 ssh/ssh-keyscan，
      # 全程只有我們自己寫的指令會經手 secret，減少供應鏈風險。
      - name: 設定 SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: 部署（git pull + docker compose up --build -d）
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull
            docker compose up --build -d
            docker image prune -f
          '
